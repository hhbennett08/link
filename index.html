<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta id="redirect" http-equiv="refresh" content="0; url=https://example.com">
  <script>
    var url = document.getElementById("redirect").content.split("url=")[1];
    window.location.replace(url);
  </script>
</head>
<body>
  <p>Redirecting… If nothing happens, <a id="fallback" href="#">click here</a>.</p>
  <script>
    document.getElementById("fallback").href = url;
  </script>
</body>
</html>
